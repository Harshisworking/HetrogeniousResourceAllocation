apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-amd64
  namespace: agentic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
      tier: amd64
  template:
    metadata:
      labels:
        app: portal
        tier: amd64
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: portal
        image: agentic-demo-portal:0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests: {cpu: "100m", memory: "64Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: agentic-demo
spec:
  selector:
    app: portal
  ports:
  - port: 80
    targetPort: 8000
