apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agentic-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: portal
        metrics_path: /metrics
        static_configs:
          - targets:
              - portal.agentic-demo.svc.cluster.local:80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agentic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.listen-address=0.0.0.0:9090
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir:
            sizeLimit: 300Mi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: agentic-demo
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
