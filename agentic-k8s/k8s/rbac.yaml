apiVersion: v1
kind: Namespace
metadata:
  name: agentic-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-controller
  namespace: agentic-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restricted-portal-scaler
  namespace: agentic-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["portal-amd64"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["portal-amd64"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restricted-portal-scaler
  namespace: agentic-demo
subjects:
  - kind: ServiceAccount
    name: agentic-controller
    namespace: agentic-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restricted-portal-scaler
