[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-k8s-foundation"
version = "0.1.0"
description = "Safety-first Kubernetes execution and event-aware control-loop foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agentic_k8s*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
